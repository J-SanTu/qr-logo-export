<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">QR Logo Export</title>
  <desc id="desc">Build UTM links and batch-generate verified SVG, PNG, and URL text files with a replaceable company logo.</desc>
  <rect width="1200" height="400" rx="8" fill="#F7F9FC"/>
  <path d="M0 344H1200V400H0Z" fill="#1A5FA9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="64" y="68" fill="#65758B" font-size="18" font-weight="700" letter-spacing="2">CODEX SKILL / BATCH QR EXPORT</text>
    <text x="64" y="146" fill="#122033" font-size="64" font-weight="800">QR Logo Export</text>
    <text x="64" y="199" fill="#33445B" font-size="24" font-weight="500">Links or UTM fields in. Verified QR files out.</text>
    <text x="64" y="242" fill="#65758B" font-size="20">Build the URL. Replace the logo. Export SVG + PNG + TXT.</text>
    <g transform="translate(64 280)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700">
