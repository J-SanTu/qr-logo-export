      <text x="174" y="25" fill="#1A5FA9">1080 PNG</text>
      <rect x="300" width="100" height="38" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="320" y="25" fill="#1A5FA9">URL TXT</text>
      <rect x="412" width="168" height="38" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="430" y="25" fill="#1A5FA9">SCAN VERIFIED</text>
    </g>
  </g>
